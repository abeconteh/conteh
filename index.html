ilding and market systems development initiatives.","His experience spans organisations including EY, Accenture, Macquarie Group, National Australia Bank, Kiwibank New Zealand, Transport for NSW, the ACCC, IAG, UNDP and Adam Smith International."],education:["Governance, risk and transformation professional","Experience across Australia, Africa, Asia and the United Kingdom"]},{slug:"rachel-conteh",name:"Rachel Conteh",role:"Managing Partner and Principal Consultant",focus:["creative-media-communications"],photo:"media/rachel-conteh.jpg",location:"Sydney",short:"Runs the firm day to day and leads Creative Media & Communications.",bio:["Rachel is Managing Partner of Conteh Consulting and leads the Creative Media & Communications practice. She finds the story, develops the message, writes the copy, produces the video and takes it to the audience that needs to hear it.","Over nearly two decades in media she has worked in national broadcasting, sports media and the not-for-profit sector. Since 2015 she has led digital and print communications for supporter engagement and fundraising at Global Mission Partners, producing monthly newsletters, quarterly magazines and short-form video, and contributing to two organisational rebrands, including website content and promotional films.","Earlier in her career Rachel was a broadcast operator with SBS, Head of Production at Discovery Church Mt Evelyn, Africa Area Video Developer with Operation Mobilization, where she established the organisation’s YouTube channel and filmed and edited stories across southern Africa, and an asset management specialist at FOX SPORTS Australia.","At Conteh Consulting she helps clients turn strategy into communication people act on: brand narrative, campaign and fundraising content, video production and change communications."],education:["Bachelor of Arts, Television Production, Charles Sturt University"],experience:[{org:"Global Mission Partners",title:"Media and Communications Specialist",dates:"20 supporter engagement",text:"Campaigns, newsletters and magazines that grow giving."},{title:"Change and stakeholder communications",text:"Communications plans that carry people through transformation."}],impact:"A three-film appeal series lifted a charity’s end-of-year giving by 31%."},{slug:"project-program-management",title:"Project & Program Management",short:"Deliver complex programs, from corporate change to international development and new businesses.",intro:"Most strategies fail in delivery. We set up programs to succeed and recover those that are struggling, including international development programs and business building and market systems development initiatives.",leader:"abe-conteh",offers:[{title:"Program and portfolio offices",text:"PMO and EPMO design, set-up, operation and recovery of troubled programs."},{title:"International development and economic growth",text:"Design, delivery, monitoring and evaluation of programs for donors, governments and NGOs."},{title:"Business building and market systems development",text:"New ventures and market systems programs that create jobs and last beyond funding."},{title:"Benefits and change",text:"Benefits realisation, change management and adoption."}],impact:"Recovered a stalled A$60m state government program and returned it to green within two quarters."},{slug:"green-growth-sustainability",title:"Green Growth & Sustainability",short:"Make the transition to a low-carbon, inclusive economy credible and investable.",intro:"Climate is now a board, investor and regulatory issue. We help organisations and governments meet new disclosure rules, build transition plans and mobilise green investment.",leader:"abe-conteh",offers:[{title:"Climate disclosure readiness",text:"AASB S2 and ISSB-aligned disclosure, governance and scenario analysis."},{title:"Transition planning",text:"Decarbonisation pathways and transition plans investors trust."},{title:"ESG strategy and reporting",text:"Materiality, targets and reporting systems."},{title:"Green investment and resilience",text:"Green finance programs and climate resilience for communities."}],impact:"Prepared an ASX-listed industrial for its first mandatory climate disclosure."}],Ar=[{slug:"banking-financial-services",media:"media/ind-banking.mp4",name:"Banking & Financial Services",short:"Resilience, regulation and growth for banks, mutuals and fintechs.",context:"Australian financial institutions face CPS 230, scams, AML reform and rising customer expectations while competing with digital-native entrants.",priorities:["Operational resilience","Financial crime and AML/CTF reform","Cost and digital productivity"],help:["CPS 230 and CPS 234 uplift programs","Risk appetite and non-financial risk frameworks","AML/CTF tranche readiness","Cost transformation and AI adoption"],caps:["governance-risk-compliance","business-analysis-strategy-transformation","data-analytics-ai-tech"],motif:2},{slug:"construction",media:"media/ind-construction.mp4",name:"Construction",short:"Better delivery and governance across the infrastructure pipeline.",context:"A record infrastructure pipeline meets labour shortages, contractor insolvencies and tighter margins.",priorities:["Project controls and delivery","Contractor and supply-chain risk","Decarbonising the built environment"],help:["Program assurance and recovery","Project governance and controls","Commercial and contract risk","Embodied-carbon strategy"],caps:["project-program-management","governance-risk-compliance","green-growth-sustainability"],motif:4},{slug:"christian-faith-based",media:"media/ph-faith.jpg",name:"Christian Faith-Based Institutions",short:"Governance, growth and storytelling for churches, missions and ministries.",context:"Churches, mission agencies and faith-based schools and charities carry deep trust. They also face rising governance expectations, safeguarding obligations and changing patterns of giving.",priorities:["Governance and safeguarding","Sustainable giving","Digital ompliance","data-analytics-ai-tech","project-program-management"],motif:10},{slug:"not-for-profit",media:"media/ind-nfp.mp4",name:"Not-for-Profit, NGOs & Charities",short:"Stronger governance, more impact and sustainable funding.",context:"Charities and NGOs must do more with less, demonstrate impact to funders and keep the trust of supporters.",priorities:["Funding diversification","Impact measurement","Governance and risk"],help:["Strategy and funding models","Monitoring, evaluation and impact reporting","Supporter campaigns and video","Board and risk frameworks"],caps:["creative-media-communications","project-program-management","governance-risk-compliance"],motif:11},{slug:"principal-investors-private-equity",media:"media/ph-dam.jpg",name:"Principal Investors and Private Equity",short:"Diligence, value creation and impact for investors.",context:"Investors need faster diligence, a credible value-creation plan and ESG data their limited partners trust.",priorities:["Commercial and operational diligence","Portfolio value creation","ESG and impact measurement"],help:["Operational and risk due diligence","100-day plans and transformation","ESG and impact frameworks","Emerging-markets investment readiness"],caps:["business-analysis-strategy-transformation","green-growth-sustainability","governance-risk-compliance"],motif:12},{slug:"public-sector",media:"media/ph-cable.jpg",name:"Public Sector",short:"Better services and better value for citizens.",context:"Governments are under pressure to modernise services, improve integrity and deliver major reforms on limited budgets.",priorities:["Service reform and digital government","Integrity and governance","Program delivery"],help:["Portfolio and program offices","Governance and integrity frameworks","Policy implementation","Economic development strategies"],caps:["project-program-management","governance-risk-compliance"],motif:13},{slug:"tmt",media:"media/ind-tmt.mp4",name:"Technology, Media and Telecommunications",short:"Growth, resilience and trust in a converging sector.",context:"Telcos, technology firms and media companies face network resilience obligations, AI disruption and changing audience habits.",priorities:["Network and operational resilience","AI products and productivity","Content and audience strategy"],help:["Resilience and outage preparedness","AI strategy and governance","Media content and production","Customer remediation programs"],caps:["data-analytics-ai-tech","creative-media-communications","governance-risk-compliance"],motif:15},{slug:"transportation-logistics",media:"media/ind-logistics.mp4",name:"Transportation and Logistics",short:"Efficient, resilient and lower-carbon networks.",context:"Freight, ports and transport operators are balancing capacity, cost and decarbonisation across long and fragile supply chains.",priorities:["Network efficiency","Safety and compliance","Fleet decarbonisation"],help:["Network and operating model optimisation","Safety and risk frameworks","Fleet transition planning","Trade corridor and market access programs"],caps:["business-analysis-strategy-transformation","green-growth-sustainability","project-program-management"],motif:0}],dc=[{slug:"ai-governance-board-agenda",media:"media/in-ai-board.mp4",title:"Five questions every board should ask about AI in 2026",type:"Perspective",cap:"data-analytics-ai-tech",date:"2026-09-15",authors:["abe-conteh"],read:"7 min",motif:2,summary:"AI is now a board-level risk and opportunity. These five questions help directors move from curiosity to oversight.",body:["Most boards we speak with have now seen an AI demonstration. Far fewer have a clear view of where AI is already in use inside their organisation, who is accountable for it and how its risks are being managed.","We suggest directors start with five questions. Where are we using AI today, including inside the tools we buy? Which uses matter most to customers, staff and regulators? Who owns each one? How would we know if it went wrong? And what value have we actually captured?","Organisations that can answer these questions tend to move faster, not slower. Clear guardrails give teams the confidence to scale what works and stop what does not.","Our experience across financial services, health and the not-for-profit sector is that a light, well-designed AI governance framework takes eight to twelve weeks to put in place and pays for itself in the first avoided incident."]},{slug:"climate-disclosure-year-one",media:"media/in-climate.mp4",title:"Climate disclosure, year one: what we learned from the first reporters",type:"Report",cap:"green-growth-sustainability",date:"2026-07-02",authors:["abe-conteh"],read:"15 min",motif:7,summary:"Group 1 entities have published their first mandatory climate statements. We reviewed 40 of them to see what good looks like.",body:["Australia’s first mandatory climate-related financial disclosures under AASB S2 are now public. We reviewed 40 statements from Group 1 entities across energy, financial services, industrials and retail.","The strongest disclosures shared three traits: governance that named specific accountabilities, scenario analysis that connected clearly to strategy, and transition plans with interim targets and capital commitments.","The weakest relied on generic language and left readers unsure how climate risk changed any decision. Scope 3 remains the hardest area, with most entities using the transitional relief available.","For Group 2 and Group 3 entities, the lesson is to start with governance and data, not the document. The statement is the output of a system, not a writing exercise."]},{slug:"story-first-fundraising",media:"media/in-story.mp4",bodyMedia:"media/in-story-body.mp4",title:"Story first: how video is reshaping charity fundraising",type:"Video",cap:"creative-media-communications",date:"2026-05-20",authors:["rachel-conteh"],read:"6 min watch",motif:11,summary:"Supporters give to people, not programs. Rachel Conteh on finding the story and telling it in under two minutes.",body:["After more than a decade producing supporter content for mission organisations, Rachel Conteh has a simple rule: find one person, one moment and one ask.","Short-form video works because it lets supporters see the change their giving makes. But it only works when the story is true, specific and told with the dignity of the people in it.","In this short film Rachel walks through how her team plans an appeal series, from field interviews to a final edit that runs under two minutes, and how to measure whether it moved supporters to give.","The approach has helped clients lift end-of-year giving by as much as 31 percent while reducing production cost per campaign."]},{slug:"cps-230-one-year-on",media:"media/in-cps230.mp4",title:"CPS 230 one year on: from compliance to genuine resilience",type:"Article",cap:"governance-risk-compliance",date:"2026-03-11",authors:["abe-conteh"],read:"9 min",motif:2,summary:"APRA’s operational risk standard has been in force for a year. The leaders are treating it as a resilience capability, not a project.",body:["CPS 230 took effect on 1 July 2025. A year in, the gap between organisations that treated it as a compliance project and those that used it to build real resilience is becoming clear.","The leaders have connected critical operations, tolerance levels and scenario testing to day-to-day management. Their boards receive concise, decision-ready reporting rather than long registers.","Others completed the documentation but have not tested it under pressure. Their first serious incident will reveal whether the framework works.","We recommend a year-one health check across five areas: critical operations mapping, tolerance setting, service-provider management, scenario testing and board reporting."]},{slug:"market-systems-pacific",media:"media/in-pacific.mp4",title:"Making markets work in the Pacific: lessons from five years of practice",type:"Report",cap:"project-program-management",date:"2025-11-18",authors:["abe-conteh"],read:"18 min",motif:5,summary:"Small markets, long distances and fragile supply chains need a different approach to market systems development.",body:["Market systems approaches were developed largely in South Asia and Africa. Applying them in the Pacific requires adaptation to small populations, high transport costs and strong customary institutions.","Our review of programs in Papua New Guinea, Timor-Leste, Fiji and Solomon Islands found that the most durable results came from working with a small number of committed private partners over longer periods.","Programs that tried to cover too many sectors spread themselves thin. Those with clear sector focus and patient co-investment saw partners continue new business models after support ended.","We set out seven practical recommendations for donors and implementers designing the next generation of Pacific programs."]},{slug:"transformation-value-leakage",media:"media/in-value.mp4",title:"Why transformations lose a third of their value, and how to keep it",type:"Article",cap:"business-analysis-strategy-transformation",date:"2025-08-26",authors:["abe-conteh"],read:"8 min",motif:9,summary:"Most transformation value is lost after the business case is approved. A disciplined transformation office keeps it.",body:["In our work with mid-sized Australian organisations we see the same pattern: an ambitious business case, a strong start and a quiet erosion of value as initiatives slip, scope changes and benefits are never tracked.","Value leakage typically happens in three places: initiatives that are never fully defined, benefits that are not owned by line leaders, and savings that are reabsorbed into budgets.","A transformation office that tracks value weekly, assigns owners and connects benefits to budgets can retain most of that value.","We share a simple five-stage value-tracking model that we use with clients, from idea through to realised value in the profit and loss."]},{slug:"faith-institutions-governance",media:"media/in-faith.mp4",title:"Faithful stewardship: governance for churches and mission agencies",type:"Perspective",cap:"governance-risk-compliance",date:"2025-05-07",authors:["rachel-conteh","abe-conteh"],read:"10 min",motif:5,summary:"Faith-based institutions carry deep trust. Modern governance helps them keep it.",body:["Churches, mission agencies and faith-based charities often rely on volunteer boards and long-standing practices. Expectations from regulators, donors and their own communities have changed.","We see four priorities: clear board roles and succession, child-safe and safeguarding frameworks, transparent financial stewardship, and honest communication with supporters.","Good governance is not a distraction from mission. It protects the people an organisation serves and the trust its supporters place in it.","This perspective draws on our work with mission agencies in Australia and partners across Africa and the Pacific."]},{slug:"state-of-pmo-2025",media:"media/in-pmo.mp4",title:"The state of the PMO 2025",type:"Report",cap:"project-program-management",date:"2025-02-19",authors:["abe-conteh"],read:"14 min",motif:4,summary:"We surveyed 112 delivery leaders across Australia. PMOs that focus on decisions outperform those that focus on reporting.",body:["Our survey of 112 portfolio and program leaders across government, financial services, construction and health found that only a third believe their PMO improves executive decision-making.","High-performing PMOs share three habits: they focus reporting on decisions, they own benefits tracking and they actively stop work that no longer fits strategy.","AI is beginning to change PMO work, with automated status reporting freeing analysts for higher-value work.","The report includes a self-assessment that PMO leaders can use to benchmark their function."]},{slug:"ai-in-insurance-claims",media:"media/in-claims.mp4",title:"Case study: a supervised AI assistant for claims triage",type:"Case study",cap:"data-analytics-ai-tech",date:"2024-10-09",authors:["abe-conteh"],read:"6 min",motif:10,summary:"How a general insurer cut triage time by 46% while keeping people in control.",body:["A general insurer asked us to help reduce growing claims backlogs without adding risk.","We worked with claims staff to design an AI assistant that summarised claims, flagged missing information and suggested a triage category, with every decision confirmed by a person.","Within six months triage time fell by 46 percent, customer complaints about delays dropped and claims staff reported higher job satisfaction.","Governance was built in from the start, with model testing, monitoring and a clear escalation path agreed with the risk team."]},{slug:"green-growth-africa",media:"media/ph-dam.jpg",title:"Green growth in Africa: from pipeline to investment",type:"Article",cap:"project-program-management",date:"2024-04-16",authors:["abe-conteh"],read:"11 min",motif:7,summary:"Climate finance commitments are rising. Bankable projects remain the bottleneck.",body:["Africa receives a small share of global climate finance despite strong renewable resources and growing demand.","Our work with development finance institutions shows the bottleneck is rarely capital. It is the pipeline of well-prepared, bankable projects.","Project preparation facilities, blended finance and local developer capacity-building can close the gap.","We outline how donors, investors and governments can work together to move projects from concept to financial close faster."]},{slug:"progress-brief-episode-1",media:"media/in-podcast.mp4",title:"The Progress Brief, episode 1: why we started Conteh Consulting",type:"Podcast",cap:"business-analysis-strategy-transformation",date:"2023-03-08",authors:["abe-conteh","rachel-conteh"],read:"28 min listen",motif:13,summary:"Abe and Rachel Conteh on founding a firm in Sydney and the kind of advice they set out to give.",body:["In the first episode of our podcast, Abe and Rachel Conteh talk about why they started Conteh Consulting.","They discuss the gap they saw between strategy and delivery, the value of combining governance and creative communication under one roof, and what they learned from working across Australia, Africa, Asia and the UK.","They also talk about building a firm around a simple promise: advice should move organisations forward.","New episodes are released every month."]},{slug:"risk-appetite-plain-english",media:"media/in-risk.mp4",title:"Risk appetite in plain English",type:"Article",cap:"governance-risk-compliance",date:"2022-09-21",authors:["abe-conteh"],read:"5 min",motif:2,summary:"Our first published piece: a risk appetite statement only works if people can use it to make a decision.",body:["Many risk appetite statements are long, abstract and rarely read. They satisfy a regulatory requirement but do not guide decisions.","A useful statement is short, written in plain English and linked to measurable limits that managers understand.","We recommend testing every statement with a simple question: would a manager know what to do differently because of it?","This was the first article published by Conteh Consulting, shortly after the firm was founded in Sydney."]}],Af=[{year:"2022",text:"Abe Conteh founds Conteh Consulting in Sydney with a focus on governance, risk and transformation. First client: a member-owned financial institution."},{year:"2023",text:"Rachel Conteh joins as Managing Partner and launches Creative Media & Communications. The Progress Brief podcast begins."},{year:"2024",text:"Data Analytics, AI & Tech and Green Growth & Sustainability practices launch. First international development engagements in East Africa and the Pacific."},{year:"2025",text:"Conteh|X launches to build new businesses with clients. The State of the PMO report is published."},{year:"2026",text:"Six capabilities across 11 industries, drawing on our leaders’ experience in more than 30 countries."}],lc=["EY","Accenture",
